name: Bug report
description: Report something that isn't working in Etch.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so we can reproduce and triage quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I open a repository with submodules, ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug.
      placeholder: |
        1. Open Etch
        2. Open repository at ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: etch-version
    attributes:
      label: Etch version (or commit SHA)
      placeholder: 0.1.0 or d4f3bc3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.2 / Windows 11 23H2 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: repo-shape
    attributes:
      label: Repository shape
      description: Roughly, what does the affected repository look like?
      options:
        - Small (<1k commits, single remote)
        - Medium (1k–20k commits)
        - Large (20k–100k commits)
        - Very large (>100k commits)
        - Monorepo / sparse-checkout / partial-clone
        - Uses Git LFS
        - Uses submodules
        - Uses worktrees
        - Other (describe in steps)
    validations:
      required: true
  - type: input
    id: git-equivalent
    attributes:
      label: Equivalent git command (if known)
      description: If you know the `git` command Etch ran or should have run, paste it here. Hugely helpful for triage.
      placeholder: git rebase -i HEAD~3
  - type: dropdown
    id: fresh-repo
    attributes:
      label: Reproducible on a fresh repo?
      description: Can you reproduce this with a brand-new `git init` repo, or only on a specific repository?
      options:
        - "Yes — reproducible on a fresh repo"
        - "No — only on a specific repository"
        - "Not sure / haven't tried"
    validations:
      required: true
  - type: checkboxes
    id: data-loss
    attributes:
      label: Data loss
      description: Did this bug cause loss of work (uncommitted changes, lost commits, etc.)?
      options:
        - label: This bug caused or could cause data loss
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant logs, error messages, or screenshots. On macOS/Linux, output from the dev console (View → Toggle Developer Tools) is especially useful.
      render: shell
