name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Etch ${{ github.ref_name }}"
          releaseBody: |
            ## Downloads

            | Platform | Asset |
            |---|---|
            | macOS (Apple Silicon) | `Etch_*_aarch64.dmg` |
            | macOS (Intel) | `Etch_*_x64.dmg` |
            | Windows | `Etch_*_x64-setup.exe` / `.msi` |
            | Linux | `etch_*_amd64.deb` / `.AppImage` |

            ## First-launch (unsigned builds)

            **macOS** — strip quarantine after copying to `/Applications`:
            ```bash
            xattr -dr com.apple.quarantine /Applications/Etch.app
            ```

            **Windows** — SmartScreen → **More info → Run anyway**.

            ## Changelog

            See [CHANGELOG.md](https://github.com/Joselay/etch/blob/main/CHANGELOG.md) for the full list of changes in this release.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
