[package]
name = "etch"
version = "0.1.2"
description = "A focused, read-only Git repository viewer for macOS, Windows and Linux."
authors = ["Joselay <tongmenglaysmae5@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Joselay/etch"
homepage = "https://github.com/Joselay/etch"
readme = "../README.md"
keywords = ["git", "git-gui", "tauri", "version-control"]
categories = ["development-tools", "gui"]

[lib]
name = "etch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Etch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
gix = { version = "0.66", default-features = false, features = ["max-performance-safe", "revision", "blob-diff"] }
thiserror = "2"
similar = "2"
notify = "6.1"
base64 = "0.22"
imagesize = "0.13"

[dev-dependencies]
tempfile = "3"
